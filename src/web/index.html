<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Local Jira</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section id="login-view" class="login-view" hidden>
        <div class="brand-lockup" aria-label="Local Jira">
          <span class="brand-mark">LJ</span>
          <span>Local Jira</span>
        </div>
        <div class="login-card">
          <p class="eyebrow">LOCAL-FIRST WORKSPACE</p>
          <h1>다시 작업을<br>이어가세요.</h1>
          <p class="intro">파일에 기록된 이슈를 한곳에서 확인합니다.</p>
          <form id="login-form">
            <label for="user-id">아이디</label>
            <input id="user-id" name="id" autocomplete="username" required autofocus>
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p id="login-error" class="form-error" role="alert" hidden></p>
            <button type="submit">로그인</button>
          </form>
        </div>
      </section>

      <section id="board-view" class="board-view" hidden>
        <header class="topbar">
          <div class="brand-lockup">
            <span class="brand-mark">LJ</span>
            <span>Local Jira</span>
          </div>
          <div class="topbar-actions">
            <span id="live-status" class="live-status"><i></i> 연결 중</span>
            <span class="divider" aria-hidden="true"></span>
            <span id="user-name" class="user-name"></span>
            <button id="logout-button" class="text-button" type="button">로그아웃</button>
          </div>
        </header>

        <div class="board-heading">
          <div>
            <p class="eyebrow">ISSUE OVERVIEW</p>
            <h1>작업 보드</h1>
            <p id="board-summary" class="summary">이슈를 불러오는 중입니다.</p>
          </div>
          <div class="filters">
            <label for="project-filter">프로젝트</label>
            <select id="project-filter">
              <option value="">모든 프로젝트</option>
            </select>
          </div>
        </div>

        <div id="board-error" class="notice error" role="alert" hidden></div>
        <div id="board-empty" class="empty-state" hidden>
          <span class="empty-icon">✓</span>
          <h2>아직 등록된 이슈가 없습니다.</h2>
          <p>CLI 또는 API에서 이슈를 만들면 이 보드에 바로 나타납니다.</p>
        </div>
        <div id="board" class="board"></div>
      </section>
    </main>
  </body>
</html>
